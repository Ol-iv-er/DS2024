<!DOCTYPE html>
<h2>Final Results</h2>

<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <table>
            {# This will create a table with each key vale pair as row#}
            {% for key, value in result.items() %}
            <tr>
                <th>{{ key }}</th> <th>{{ value }}</th>
            </tr>
            {% endfor %} <!-- Remember to close for loop {# endfor #}-->
        </table>
        

    </body>
</html>
