<!DOCTYPE html>
<h2>Final Results</h2>

<html>
    <body>
        {% if result >= 70 %}
        <h2>Your result is Passed!</h2>
        {% else %}
        <h2>Your result is Failed, better luck next time.</h2>
        {% endif %} {# You have to use the "endif" when using if statements so we know when to close condition#}
    </body>
</html>
